name: makusanyo
description: Mfumo wa Makusanyo ya Pesa (Offline) - WAWATA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  pdf: ^3.11.1
  excel: ^4.0.6
  file_picker: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/badger.png
    - assets/church_bg.png

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  image_path: "assets/logo.png"
